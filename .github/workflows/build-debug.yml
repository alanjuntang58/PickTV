name: 构建 PickTV Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21（项目要求 Java 21 编译）
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 安装 Android 37 编译SDK与构建工具
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: 自动生成 local.properties（解决文件缺失报错）
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "storeFile=release.jks" >> local.properties
          echo "keyAlias=key" >> local.properties
          echo "storePassword=123456" >> local.properties

      - name: 缓存 Gradle 加速构建
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 Mobile 通用版（armeabi-v7a，手机/盒子通用）
        run: ./gradlew assembleMobileArmeabi_v7aDebug

      - name: 上传 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: PickTV-Mobile-Armv7-Debug
          path: app/build/outputs/apk/mobile/armeabi_v7a/debug/*.apk
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 授予执行权限
        run: chmod +x gradlew

      - name: 开始构建安装包
        run: ./gradlew assembleDebug

      - name: 打包APK供下载
        uses: actions/upload-artifact@v4
        with:
          name: PickTV-测试版安装包
          path: app/build/outputs/apk/debug/*.apk
